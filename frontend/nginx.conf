server {
    listen 80;
    server_name localhost;

    # Assets con hash de contenido (JS, CSS, imágenes): cachear por 1 año
    # CRA genera nombres como main.abc123.chunk.js, nunca cambia el nombre si no cambia el contenido
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML y rutas SPA: nunca cachear, siempre verificar versión en el servidor
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
